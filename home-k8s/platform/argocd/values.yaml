# 初期導入は Helm 管理。Application の自動同期・自己管理は別途レビューする。
global:
  nodeSelector:
    home-k8s.io/longhorn-storage: "true"
configs:
  cm:
    admin.enabled: true
    users.anonymous.enabled: false
  params:
    server.insecure: false
  rbac:
    policy.default: ""
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 256Mi}
server:
  replicas: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
controller:
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {memory: 1Gi}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
redis:
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {memory: 256Mi}
redisSecretInit:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 128Mi}
