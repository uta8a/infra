# 移行完了後の目標設定。稼働中の Flannel と並行して適用しない。
ipam:
  mode: kubernetes
kubeProxyReplacement: true
k8sServiceHost: localhost
k8sServicePort: 7445
routingMode: tunnel
tunnelProtocol: vxlan
bpf:
  hostLegacyRouting: true
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
securityContext:
  capabilities:
    ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
operator:
  replicas: 2
  nodeSelector:
    home-k8s.io/longhorn-storage: "true"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi
hubble:
  relay:
    enabled: false
  ui:
    enabled: false
