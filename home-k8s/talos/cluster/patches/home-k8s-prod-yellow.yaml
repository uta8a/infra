# Every item is a Talos v1.14 configuration document. This file has no
# credentials and is merged into the generated control-plane config.
apiVersion: v1alpha1
kind: HostnameConfig
hostname: home-k8s-prod-yellow
auto: off
---
apiVersion: v1alpha1
kind: LinkAliasConfig
name: controlplane0
selector:
  match: mac(link.permanent_addr) == "52:54:00:30:00:63"
---
apiVersion: v1alpha1
kind: LinkConfig
name: controlplane0
up: true
addresses:
  - address: 192.168.30.63/24
routes:
  - gateway: 192.168.30.1
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.30.1
searchDomains:
  domains:
    - home.arpa
---
apiVersion: v1alpha1
kind: Layer2VIPConfig
name: 192.168.30.5
link: controlplane0
---
apiVersion: v1alpha1
kind: UnattendedInstallConfig
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/vda"
---
apiVersion: v1alpha1
kind: KubeNodeConfig
labels:
  home-k8s.io/longhorn-storage: "false"
  home-k8s.io/workload-scheduling: "disabled"
