apiVersion: apps/v1
kind: StatefulSet
metadata: {name: opensearch, namespace: curatedz}
spec:
  serviceName: opensearch
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: opensearch}}
  template:
    metadata: {labels: {app.kubernetes.io/name: opensearch}}
    spec:
      automountServiceAccountToken: false
      securityContext: {fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.9.0
          env:
            - {name: discovery.type, value: single-node}
            - {name: DISABLE_SECURITY_PLUGIN, value: "true"}
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms1g -Xmx1g"}
            - {name: node.store.allow_mmap, value: "false"}
          ports:
            - {name: http, containerPort: 9200}
          resources:
            requests: {cpu: 500m, memory: 1536Mi}
            limits: {cpu: "2", memory: 3Gi}
          securityContext:
            {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, runAsNonRoot: true, runAsUser: 1000}
          readinessProbe:
            httpGet: {path: /_cluster/health, port: http}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /_cluster/health, port: http}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /usr/share/opensearch/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: longhorn
        resources: {requests: {storage: 20Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: opensearch, namespace: curatedz}
spec:
  selector: {app.kubernetes.io/name: opensearch}
  ports: [{name: http, port: 9200, targetPort: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: sync-checkpoint, namespace: curatedz}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: curatedz-aws, namespace: curatedz}
data:
  bucket: curatedz-archiveda4cb258-x6hvqsmspn6y
  region: ap-northeast-1
  config: |
    [default]
    region = ap-northeast-1
    credential_process = /usr/local/bin/aws_signing_helper credential-process --certificate /var/run/curatedz-aws/tls.crt --private-key /var/run/curatedz-aws/tls.key --trust-anchor-arn arn:aws:rolesanywhere:ap-northeast-1:019904854450:trust-anchor/1ea13015-a3e2-4f7f-bf31-a749f8979adc --profile-arn arn:aws:rolesanywhere:ap-northeast-1:019904854450:profile/ed3f6b0a-c0b1-4f50-9e0e-1436afecd4b7 --role-arn arn:aws:iam::019904854450:role/Curatedz-HomeSync
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: curatedz-sync, namespace: curatedz}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata: {labels: {app.kubernetes.io/name: curatedz-sync}}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: sync
              image: ghcr.io/uta8a/curatedz/sync@sha256:f057b21d935cdbb49ccb384929004babbaf5c9da2c95dba6c9f6013e67798f70
              env:
                - {name: CURATEDZ_OPENSEARCH_URL, value: "http://opensearch:9200"}
                - {name: CURATEDZ_CHECKPOINT, value: "/data/checkpoint.json"}
                - name: CURATEDZ_BUCKET
                  valueFrom: {configMapKeyRef: {name: curatedz-aws, key: bucket}}
                - name: AWS_REGION
                  valueFrom: {configMapKeyRef: {name: curatedz-aws, key: region}}
                - {name: AWS_CONFIG_FILE, value: "/etc/curatedz/aws/config"}
                - {name: AWS_SDK_LOAD_CONFIG, value: "1"}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
              volumeMounts:
                - {name: checkpoint, mountPath: /data}
                - {name: aws-config, mountPath: /etc/curatedz/aws, readOnly: true}
                - {name: aws-credentials, mountPath: /var/run/curatedz-aws, readOnly: true}
          volumes:
            - {name: checkpoint, persistentVolumeClaim: {claimName: sync-checkpoint}}
            - name: aws-config
              configMap:
                name: curatedz-aws
                defaultMode: 0444
                items: [{key: config, path: config}]
            - name: aws-credentials
              secret:
                secretName: curatedz-aws
                defaultMode: 0440
                items:
                  - {key: tls.crt, path: tls.crt}
                  - {key: tls.key, path: tls.key}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: curatedz-web, namespace: curatedz}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: curatedz-web}}
  template:
    metadata: {labels: {app.kubernetes.io/name: curatedz-web}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: ghcr.io/uta8a/curatedz/web@sha256:7b02b8b1affe2361fb07761327c491de90cff6507187270afa8d92add4c218d5
          env:
            - {name: CURATEDZ_OPENSEARCH_URL, value: "http://opensearch:9200"}
            - name: CF_ACCESS_TEAM_DOMAIN
              valueFrom: {secretKeyRef: {name: curatedz-cloudflare, key: team-domain}}
            - name: CF_ACCESS_AUD
              valueFrom: {secretKeyRef: {name: curatedz-cloudflare, key: audience}}
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 30}
---
apiVersion: v1
kind: Service
metadata: {name: curatedz-web, namespace: curatedz}
spec:
  selector: {app.kubernetes.io/name: curatedz-web}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cloudflared, namespace: curatedz}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: cloudflared}}
  template:
    metadata: {labels: {app.kubernetes.io/name: cloudflared}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args: [tunnel, --no-autoupdate, --loglevel, info, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: {secretKeyRef: {name: curatedz-cloudflare, key: tunnel-token}}
          ports: [{name: metrics, containerPort: 2000}]
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}, readOnlyRootFilesystem: true}
          livenessProbe: {httpGet: {path: /ready, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: opensearch-ingress, namespace: curatedz}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: opensearch}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: curatedz-web}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: curatedz-sync}}
      ports: [{protocol: TCP, port: 9200}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: web-ingress, namespace: curatedz}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: curatedz-web}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: cloudflared}}}]
      ports: [{protocol: TCP, port: 8080}]
