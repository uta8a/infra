name: home-k8s OCI artifact

on:
  pull_request:
    paths:
      - home-k8s/platform/**
      - home-k8s-app/**
      - .github/workflows/publish-home-k8s-oci.yaml
      - .github/actions/setup-gitleaks/**
  push:
    branches: [main]
    paths:
      - home-k8s/platform/**
      - home-k8s-app/**
      - .github/workflows/publish-home-k8s-oci.yaml
      - .github/actions/setup-gitleaks/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        package: [home-k8s, home-k8s-app]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - name: 公開ファイルを梱包・検証
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 home-k8s/platform/package-oci.py "$PACKAGE" "$RUNNER_TEMP/$PACKAGE.tar.gz"
      - uses: ./.github/actions/setup-gitleaks
      - name: 展開後の秘密情報検査
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python3 -m unittest discover -s home-k8s/platform -p 'test_*.py'
          python3 home-k8s/platform/audit-oci.py "$PACKAGE" "$RUNNER_TEMP/$PACKAGE.tar.gz"
      # publish jobでも同じ入力から再ビルドする。PRにpublish権限を付与しない。

  publish:
    needs: build
    if: github.repository == 'uta8a/infra' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [home-k8s, home-k8s-app]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.3.0
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
        with:
          version: 1.3.1
      - uses: ./.github/actions/setup-gitleaks
      - name: OCI artifact を配布
        env:
          PACKAGE: ${{ matrix.package }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DOCKER_CONFIG: ${{ runner.temp }}/oci-auth
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          python3 home-k8s/platform/package-oci.py "$PACKAGE" "$RUNNER_TEMP/$PACKAGE.tar.gz"
          python3 home-k8s/platform/audit-oci.py "$PACKAGE" "$RUNNER_TEMP/$PACKAGE.tar.gz"
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GHCR_USER" --password-stdin
          repository="ghcr.io/uta8a/infra/$PACKAGE"
          tag="sha-$GITHUB_SHA-run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cd "$RUNNER_TEMP"
          oras push "$repository:$tag" \
            --annotation "org.opencontainers.image.source=https://github.com/uta8a/infra" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            "$PACKAGE.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip"
          digest=$(oras resolve "$repository:$tag")
          oras manifest fetch "$repository@$digest" > manifest.json
          jq -e '.layers | length == 1' manifest.json
          jq -e '.layers[0].mediaType == "application/vnd.oci.image.layer.v1.tar+gzip"' manifest.json
          {
            echo "### $PACKAGE"
            echo "- Git revision: \`$GITHUB_SHA\`"
            echo "- Tag: \`$repository:$tag\`"
            echo "- OCI source: \`oci://$repository\`"
            echo "- targetRevision: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
